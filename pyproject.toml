[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-extractor"
version = "1.0.0"
description = "Extract indicators of compromise (IPs, domains, URLs, emails, hashes, CVEs) from text."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md Abu Bakar Siddique" }]

[project.scripts]
ioc-extractor = "iocextractor.cli:main"

[tool.setuptools.packages.find]
include = ["iocextractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
